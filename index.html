<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chloe Aquarium</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="message-overlay" id="message-overlay">
      <div class="message-content">
        <button
          class="message-close"
          id="message-close"
          aria-label="Close message"
        >
          ×
        </button>
        <div class="message-text">
          <p>Hi Chloe,</p>
          <p>
            I hope Singapore becomes lighter for you with time, or that wherever
            life takes you next feels more like home. I wish you warmth,
            openness, and moments that surprise you in good ways.
          </p>
          <p>
            You're a special person in your own way, and I hope you find places
            and people that resonate with that.
          </p>
        </div>
      </div>
    </div>
    <div class="game-container">
      <canvas id="game" width="896" height="504"></canvas>
      <div class="controls">
        <button id="btn-left" class="control-btn" aria-label="Move left">
          <span>◀</span>
        </button>
        <button id="btn-right" class="control-btn" aria-label="Move right">
          <span>▶</span>
        </button>
      </div>
    </div>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
